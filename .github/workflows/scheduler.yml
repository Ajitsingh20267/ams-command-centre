name: A.M.S. autonomous scheduler

# This is the free replacement for a long-running scheduler process. GitHub
# Actions' scheduled workflows are free on both public and private repos
# (private repos get a monthly minutes allowance on the free plan; this job
# runs in seconds, so it comfortably fits). No VPS, no Vercel Cron limits.
#
# Runs Monday-Friday for sourcing/reporting (matches every other desk in the
# firm), and every day for nothing here yet — add a followup/reply-check job
# once the Graph mailbox is connected (see app/routers/oauth_ms.py).
on:
  schedule:
    - cron: "0 7 * * 1-5"    # 07:00 UTC weekdays — discover leads
    - cron: "0 17 * * 1-5"   # 17:00 UTC weekdays — match investors + report
  workflow_dispatch: {}       # manual "Run workflow" button in the Actions tab

jobs:
  discover-leads:
    if: github.event.schedule == '0 7 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call /cron/discover-leads
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/cron/discover-leads" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 120 | tee response.json
      - name: Fail the job if the endpoint reported an error
        run: python3 -c "import json,sys; d=json.load(open('response.json')); sys.exit(0 if d.get('ok') else 1)"

  match-investors-and-report:
    if: github.event.schedule == '0 17 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call /cron/match-investors
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/cron/match-investors" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" --max-time 120
      - name: Call /cron/report
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/cron/report" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" --max-time 60

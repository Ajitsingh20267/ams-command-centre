name: A.M.S. autonomous scheduler

# This is the free replacement for a long-running scheduler process. GitHub
# Actions' scheduled workflows are free on both public and private repos
# (private repos get a monthly minutes allowance on the free plan; this job
# runs in under two minutes, so a full 24/7 cadence comfortably fits). No
# VPS, no Vercel Cron limits.
#
# Runs every hour, every day of the week — genuine 24/7 coverage, not tied
# to any single region's business hours, since the point of the autonomous
# loop is that it doesn't wait for anyone's morning. GitHub Actions cron is
# UTC-only with no daylight-saving concept, which is exactly what "24/7
# globally" wants: one clock, no timezone favoured over another.
"on":
  schedule:
    - cron: "0 * * * *"    # every hour, on the hour, every day
  workflow_dispatch: {}     # manual "Run workflow" button in the Actions tab

jobs:
  hourly-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Discover leads (SEC EDGAR — US public companies)
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/cron/discover-leads" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" --max-time 120 | tee response.json
          python3 -c "import json,sys; sys.exit(0 if json.load(open('response.json')).get('ok') else 1)"

      - name: Discover leads (Companies House — UK private companies)
        # Returns ok:false with CONNECTION REQUIRED until COMPANIES_HOUSE_KEY
        # is set — expected, not a failure to alert on. --max-time is 280s,
        # not 120s: each candidate makes up to 4 real HTTP calls (profile,
        # officers, PSC, charges) plus a rate-limit sleep, and a run of
        # ~60 candidates genuinely got a step-killing curl timeout (exit
        # 28) at 120s on 2026-09-07 — a real one, not a server error.
        run: |
          curl -s -X POST "${{ secrets.APP_URL }}/cron/discover-leads-uk" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" --max-time 280

      - name: Discover contacts (Companies House officers — UK leads)
        # Names a real, active officer for each qualifying UK lead so
        # draft-outreach has someone to address — never invents an email;
        # see app/agents/contact_discovery.py for why. Returns ok:false
        # with CONNECTION REQUIRED until COMPANIES_HOUSE_KEY is set —
        # expected, not a failure to alert on. Same generous timeout as
        # the sweep above, and for the same reason (one HTTP call per
        # qualifying lead).
        run: |
          curl -s -X POST "${{ secrets.APP_URL }}/cron/discover-contacts-uk" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" --max-time 280

      - name: Discover sole traders (FSA Food Hygiene Ratings — unscored)
        # No CONNECTION REQUIRED gate: the FSA API needs no key at all.
        # Feeds a separate, unscored list (sole_trader_leads) rather than
        # the main pipeline -- see app/agents/sole_trader_discovery.py for
        # why sole traders can't be gated the same way limited companies
        # are (no filed accounts, no officers/PSC data exists for them).
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/cron/discover-sole-traders" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" --max-time 120

      - name: Draft outreach for eligible leads
        # Returns ok:false with CONNECTION REQUIRED until Graph + Anthropic
        # are configured — expected, not a failure to alert on.
        run: |
          curl -s -X POST "${{ secrets.APP_URL }}/cron/draft-outreach" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" --max-time 120

      - name: Check for replies
        run: |
          curl -s -X POST "${{ secrets.APP_URL }}/cron/check-replies" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" --max-time 60

      - name: Match investors for active fundraising clients
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/cron/match-investors" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" --max-time 120

      - name: Update the running report
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/cron/report" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" --max-time 60
